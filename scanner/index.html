<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Scanner — Floor Plan Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { background: #0A0A0F; }
    .btn-primary { background: linear-gradient(135deg, #006FFF, #0057CC); transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,111,255,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .loader { border: 3px solid #252B3B; border-top-color: #006FFF; border-radius: 50%;
              width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #resultImg { border: 2px solid #252B3B; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 gap-6">

  <!-- Header -->
  <div class="w-full max-w-lg pt-4">
    <div class="flex items-center gap-2 mb-1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#006FFF" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
      <h1 class="text-white font-semibold text-lg">Room Scanner</h1>
    </div>
    <p class="text-gray-500 text-sm">從相機照片自動生成建築平面圖</p>
  </div>

  <!-- Step 1: Capture -->
  <div class="w-full max-w-lg bg-gray-900 rounded-2xl border border-gray-800 p-5">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-3">步驟 1 — 拍攝房間</p>

    <div class="bg-gray-800 rounded-xl p-3 mb-4 text-xs text-gray-400 leading-relaxed">
      <p class="font-medium text-gray-300 mb-1">拍攝建議</p>
      <ul class="list-disc list-inside space-y-0.5">
        <li>站在房間角落，對角線方向拍攝</li>
        <li>盡量讓牆壁完整入鏡</li>
        <li>光線充足、避免過曝</li>
        <li>移除前景雜物效果更好</li>
      </ul>
    </div>

    <!-- Preview -->
    <div id="previewBox" class="hidden mb-4">
      <img id="previewImg" src="" alt="Preview"
           class="w-full rounded-xl object-cover" style="max-height:260px;" />
    </div>

    <div class="flex gap-2">
      <button onclick="document.getElementById('fileInput').click()"
        class="flex-1 btn-primary text-white text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M20 7h-3.38l-1.5-2h-6.24l-1.5 2H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
        </svg>
        拍照 / 選擇圖片
      </button>

      <button id="processBtn" onclick="processImage()" disabled
        class="flex-1 bg-gray-700 text-gray-400 text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all"
        style="cursor:not-allowed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 6s4-4 11-4 11 4 11 4M1 12s4-4 11-4 11 4 11 4M5 18s2-2 7-2 7 2 7 2"/>
        </svg>
        產生平面圖
      </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment"
           class="hidden" onchange="onFileSelected(event)" />
  </div>

  <!-- Step 2: Processing indicator -->
  <div id="processingBox" class="hidden w-full max-w-lg bg-gray-900 rounded-2xl border border-gray-800 p-5 flex flex-col items-center gap-3">
    <div class="loader"></div>
    <p class="text-sm text-gray-400">分析影像中，請稍候…</p>
    <p class="text-xs text-gray-600">OpenCV 邊緣偵測 + Hough 線段轉換</p>
  </div>

  <!-- Step 3: Result -->
  <div id="resultBox" class="hidden w-full max-w-lg bg-gray-900 rounded-2xl border border-gray-800 p-5">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-3">步驟 2 — 生成平面圖</p>

    <img id="resultImg" src="" alt="Floor Plan" class="w-full rounded-xl mb-4" />

    <div class="bg-gray-800 rounded-xl p-3 mb-4 text-xs text-gray-400">
      <p class="text-yellow-400 font-medium mb-1">⚠ 注意</p>
      <p>此平面圖由單張照片自動生成，僅供參考。牆壁位置可能有偏差，適合用於 Wi-Fi 訊號模擬的概略分析。</p>
    </div>

    <div class="flex gap-2">
      <a id="downloadBtn" href="#" download="floor_plan.png"
        class="flex-1 btn-primary text-white text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        下載平面圖
      </a>
      <button onclick="reset()"
        class="flex-1 bg-gray-800 border border-gray-700 text-gray-300 text-sm font-medium py-2.5 px-4 rounded-xl hover:border-blue-500 hover:text-blue-400 transition-all">
        重新拍攝
      </button>
    </div>

    <p class="text-xs text-gray-600 text-center mt-3">
      下載後，到
      <a href="../index.html" class="text-blue-500 underline">Wi-Fi 分析工具</a>
      上傳此平面圖進行訊號模擬
    </p>
  </div>

  <!-- Error -->
  <div id="errorBox" class="hidden w-full max-w-lg bg-red-950 rounded-2xl border border-red-800 p-4">
    <p class="text-red-400 text-sm font-medium mb-1">處理失敗</p>
    <p id="errorMsg" class="text-red-300 text-xs"></p>
    <button onclick="reset()" class="mt-3 text-xs text-gray-400 underline">重試</button>
  </div>

  <script>
    let selectedFile = null;

    function onFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;

      const url = URL.createObjectURL(file);
      document.getElementById('previewImg').src = url;
      document.getElementById('previewBox').classList.remove('hidden');

      const btn = document.getElementById('processBtn');
      btn.disabled = false;
      btn.style.cursor = 'pointer';
      btn.className = 'flex-1 btn-primary text-white text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all';

      // Hide previous results
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('errorBox').classList.add('hidden');

      e.target.value = '';
    }

    async function processImage() {
      if (!selectedFile) return;

      document.getElementById('processingBox').classList.remove('hidden');
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('errorBox').classList.add('hidden');
      document.getElementById('processBtn').disabled = true;

      const formData = new FormData();
      formData.append('image', selectedFile);

      try {
        const res = await fetch('/process', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok || data.error) throw new Error(data.error || '伺服器錯誤');

        document.getElementById('resultImg').src = data.floor_plan;
        document.getElementById('downloadBtn').href = data.floor_plan;
        document.getElementById('resultBox').classList.remove('hidden');
      } catch (err) {
        document.getElementById('errorMsg').textContent = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
      } finally {
        document.getElementById('processingBox').classList.add('hidden');
        document.getElementById('processBtn').disabled = false;
      }
    }

    function reset() {
      selectedFile = null;
      document.getElementById('previewBox').classList.add('hidden');
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('errorBox').classList.add('hidden');
      document.getElementById('previewImg').src = '';

      const btn = document.getElementById('processBtn');
      btn.disabled = true;
      btn.style.cursor = 'not-allowed';
      btn.className = 'flex-1 bg-gray-700 text-gray-400 text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all';
    }
  </script>
</body>
</html>
